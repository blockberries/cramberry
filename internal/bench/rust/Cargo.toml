[package]
name = "cramberry-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cramberry = { path = "../../../rust" }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.7"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "encode_decode"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
