version: "2"
run:
  tests: true
linters:
  enable:
    - copyloopvar
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
        - commentedOutCode
        - ifElseChain
        - assignOp
        - sprintfQuotedString
        - elseif
        - appendAssign
      enabled-tags:
        - diagnostic
        - performance
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        path: _gen\.go
      - linters:
          - errcheck
          - revive
          - unparam
          - unused
        path: _test\.go
      - linters:
          - errcheck
          - revive
        path: benchmark_test\.go
      - linters:
          - revive
        path: pkg/extract/
        text: stutters
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/blockberries/cramberry
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
